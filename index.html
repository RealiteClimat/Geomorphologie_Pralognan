<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title></title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/multi-style-layer.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="data/Glacierrocheux_2.js"></script>
        <script src="data/Lignes_3.js"></script>
        <script>
        var m2px = 1;
        function newM2px() {
            var centerLatLng = map.getCenter();
            var pointC = map.latLngToContainerPoint(centerLatLng);
            var pointX = [pointC.x + 100, pointC.y];

            var latLngC = map.containerPointToLatLng(pointC);
            var latLngX = map.containerPointToLatLng(pointX);

            var distanceX = latLngC.distanceTo(latLngX)/100;

            reciprocal = 1 / distanceX;
            m2px = reciprocal;
        }
        function geoStyle(m) {
            return Math.ceil(m * m2px);
        }
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[45.334519276374856,6.660893571025494],[45.33749607133139,6.667120184001489]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_MNTLiDARHDIGN_0');
        map.getPane('pane_MNTLiDARHDIGN_0').style.zIndex = 400;
        var layer_MNTLiDARHDIGN_0 = L.tileLayer('https://data.geopf.fr/tms/1.0.0/IGNF_LIDAR-HD_MNT_ELEVATION.ELEVATIONGRIDCOVERAGE.SHADOW/{z}/{x}/{y}.png', {
            pane: 'pane_MNTLiDARHDIGN_0',
            opacity: 1.0,
            attribution: '<a href="https://geoservices.ign.fr/lidarhd">MNT LiDAR HD IGN</a>',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 18
        });
        layer_MNTLiDARHDIGN_0;
        map.addLayer(layer_MNTLiDARHDIGN_0);
        map.createPane('pane_GeoQMap_1');
        map.getPane('pane_GeoQMap_1').style.zIndex = 401;
        var layer_GeoQMap_1 = L.tileLayer('https://map.geoq.cn/ArcGIS/rest/services/ChinaOnlineCommunity/MapServer/tile/{z}/{y}/{x}', {
            pane: 'pane_GeoQMap_1',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 18
        });
        layer_GeoQMap_1;
        map.addLayer(layer_GeoQMap_1);
        function pop_Glacierrocheux_2(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['id'] !== null ? autolinker.link(String(feature.properties['id']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['Activiter'] !== null ? autolinker.link(String(feature.properties['Activiter']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Photos</th>\
                        <td>' + (feature.properties['Photos'] !== null ? '<img src="images/' + String(feature.properties['Photos']).replace(/[\\/:]/g, '_').trim().replace(/'/g, '\'').replace(/"/g, '&quot;') + '">' : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Glacierrocheux_2_0() {
            return {
                pane: 'pane_Glacierrocheux_2',
                stroke: false, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(254,33,203,0.10196078431372549)',
                interactive: true,
            }
        }
        function style_Glacierrocheux_2_1() {
            return {
                pane: 'pane_Glacierrocheux_2',
                opacity: 1,
                color: 'rgba(254,33,203,0.10196078431372549)',
                dashArray: 'null',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: geoStyle(1.0),
                fillOpacity: 0,
                interactive: true,
            }
        }
        map.createPane('pane_Glacierrocheux_2');
        map.getPane('pane_Glacierrocheux_2').style.zIndex = 402;
        map.getPane('pane_Glacierrocheux_2').style['mix-blend-mode'] = 'normal';
        var layer_Glacierrocheux_2 = new L.geoJson.multiStyle(json_Glacierrocheux_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Glacierrocheux_2',
            layerName: 'layer_Glacierrocheux_2',
            pane: 'pane_Glacierrocheux_2',
            onEachFeature: pop_Glacierrocheux_2,
            styles: [style_Glacierrocheux_2_0,style_Glacierrocheux_2_1,]
        });
        bounds_group.addLayer(layer_Glacierrocheux_2);
        map.addLayer(layer_Glacierrocheux_2);
        function pop_Lignes_3(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['id'] !== null ? autolinker.link(String(feature.properties['id']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['Type'] !== null ? autolinker.link(String(feature.properties['Type']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Lignes_3_0() {
            return {
                pane: 'pane_Lignes_3',
                opacity: 1,
                color: 'rgba(207,0,230,0.6901960784313725)',
                dashArray: 'null',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: geoStyle(2.0),
                fillOpacity: 0,
                interactive: true,
            }
        }
        map.createPane('pane_Lignes_3');
        map.getPane('pane_Lignes_3').style.zIndex = 403;
        map.getPane('pane_Lignes_3').style['mix-blend-mode'] = 'normal';
        var layer_Lignes_3 = new L.geoJson(json_Lignes_3, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Lignes_3',
            layerName: 'layer_Lignes_3',
            pane: 'pane_Lignes_3',
            onEachFeature: pop_Lignes_3,
            style: style_Lignes_3_0,
        });
        bounds_group.addLayer(layer_Lignes_3);
        map.addLayer(layer_Lignes_3);
        var overlaysTree = [
            {label: '<img src="legend/Lignes_3.png" /> Lignes', layer: layer_Lignes_3},
            {label: '<img src="legend/Glacierrocheux_2.png" /> Glacier rocheux', layer: layer_Glacierrocheux_2},
        {label: '<b>Satellite</b>',  selectAllCheckbox: true, children: [
            {label: "GeoQ Map", layer: layer_GeoQMap_1, radioGroup: 'bm' },
            {label: "MNT LiDAR HD IGN", layer: layer_MNTLiDARHDIGN_0, radioGroup: 'bm' },]},]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: true,
        });
        lay.addTo(map);
        setBounds();
        newM2px();

            layer_Glacierrocheux_2.setStyle(style_Glacierrocheux_2_0);
            layer_Lignes_3.setStyle(style_Lignes_3_0);
        map.on("zoomend", function(){
            newM2px();

            layer_Glacierrocheux_2.setStyle(style_Glacierrocheux_2_0);
            layer_Lignes_3.setStyle(style_Lignes_3_0);
        });
        </script>        
    </body>
</html>
